# Sign in with Apple needs a client secret that expires every 6 months. This calls the rotate-apple-secret
# Edge Function every Monday; the function only renews the secret when it is within 45 days of expiring
# (or when it has never been set), so most runs do nothing. If a run fails, GitHub emails you.
# Add repository secrets: SUPABASE_URL and APPLE_ROTATION_TOKEN (the same value as the function secret).
name: rotate-apple-secret
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Renew now even if the current secret is still valid'
        type: boolean
        default: false
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Renew the Apple client secret if it is close to expiring
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          APPLE_ROTATION_TOKEN: ${{ secrets.APPLE_ROTATION_TOKEN }}
          FORCE: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/functions/v1/rotate-apple-secret" \
            -H "Authorization: Bearer $APPLE_ROTATION_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"force\": $FORCE}")
          echo "$response"
