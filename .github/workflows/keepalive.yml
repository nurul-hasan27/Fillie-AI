# Supabase pauses free projects after about a week with no activity. This pings
# the API twice a week so the project (and the data in it) stays up. Free.
# Add two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY.
name: keepalive
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/entitlements?select=user_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
